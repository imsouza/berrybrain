[project]
name = "berrybrain-api"
version = "1.4.7"
description = "BerryBrain local API"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.0,<4.10",
  "argon2-cffi>=23.1.0",
  "fastapi>=0.140.0,<0.141.0",
  "faster-whisper>=1.2.1,<2.0",
  "httpx>=0.28.0,<0.29.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=6.15.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "B905", "E501"]
