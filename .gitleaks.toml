title = "BerryBrain secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Known lifecycle password fixture from the authentication test history"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^StrongPass123$''']
  paths = ['''^apps/api/tests/test_(security_auth|integration)\.py$''']

  [[rules.allowlists]]
  description = "Known browser owner-password fixture"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^(BerryBrain123!|E2eOwnerPass123)$''']
  paths = ['''^apps/web/e2e/workspace\.spec\.ts$''']

  [[rules.allowlists]]
  description = "Public distro signing keys embedded in generated Trivy reports"
  paths = ['''^docs/reports/security/trivy-(api|hipporag|web|worker)\.json$''']

  [[rules.allowlists]]
  description = "Synthetic provider-prefix fixtures in AI configuration unit tests"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^(AIzaSyTestKey123|nvapi-test-123)$''']
  paths = ['''^apps/api/tests/test_ai_configuration_v2\.py$''']

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Documentation placeholder token in NOAA reference skill"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^YOUR_TOKEN$''']
  paths = ['''^skills/scientific-references/database-lookup-noaa\.md$''']
