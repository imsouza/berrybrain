title = "BerryBrain secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Known lifecycle password fixture from the authentication test history"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^StrongPass123$''']
  paths = ['''^apps/api/tests/test_(security_auth|integration)\.py$''']

  [[rules.allowlists]]
  description = "Known browser owner-password fixture"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^(BerryBrain123!|E2eOwnerPass123)$''']
  paths = ['''^apps/web/e2e/workspace\.spec\.ts$''']

  [[rules.allowlists]]
  description = "Public distro signing keys embedded in generated Trivy reports"
  paths = ['''^docs/reports/security/trivy-(api|hipporag|web|worker)\.json$''']
