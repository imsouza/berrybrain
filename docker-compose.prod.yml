services:
  nginx:
    image: nginx:alpine
    container_name: berrybrain_nginx
    restart: always
    ports:
      - "${BERRYBRAIN_PROXY_HTTP:-80}:80"
      - "${BERRYBRAIN_PROXY_HTTPS:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/locations.conf:/etc/nginx/berrybrain-locations.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

  certbot:
    image: ${BERRYBRAIN_CERTBOT_IMAGE:-certbot/certbot:latest}
    container_name: berrybrain_certbot
    profiles: [certificates]
    entrypoint: [certbot]
    command: [--help]
    restart: "no"
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/logs:/var/log/letsencrypt
