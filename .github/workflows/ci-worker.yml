name: CI Worker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    env:
      BERRYBRAIN_ENV: test
      BERRYBRAIN_DATABASE_URL: sqlite:////tmp/berrybrain-ci-worker.db
      BERRYBRAIN_VAULT_PATH: /tmp/berrybrain-ci-worker-vault
      BERRYBRAIN_API_TOKEN: ci-token
      BERRYBRAIN_SESSION_SECRET: ci-session-secret-change-me-32-bytes
      BERRYBRAIN_REQUIRE_AUTH: "true"
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../api
          pip install -e .
          pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Worker tests
        run: PYTHONPATH=src python -m unittest discover tests
